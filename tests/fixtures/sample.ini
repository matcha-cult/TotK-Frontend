# totk.ini 测试样本（手写合成；仅使用 docs/settings.md 中的公开键名，不含任何游戏数据）
# 注释、空行、未知键与未知节用于验证“只改目标行、其余逐字节保留”。

[frame rate]
# 帧率上限：默认 60
fps_limit = 60
realtime = 1
frame_queue = 0

[display]
window_size = 1920x1080
fullscreen = 0
unknown_future_key = keep-me
output_res = 1920x1080
upscaler = fsr
sharpness = 80
aspect = fit

[input]
motion = 1
mouse_mode = direct
mouse_sens = 1
lstick_deadzone = 8

[audio]
volume = 100
audio_channels = stereo

; 分号注释，位于未知节之前
[custom section]
custom_key = foo
